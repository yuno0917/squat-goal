<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>スクワット伸び計算機 ロジックのテスト</title>
<style>
  body { font-family: system-ui, "Yu Gothic UI", Meiryo, sans-serif; margin: 16px; line-height: 1.6; background: #fff; color: #1a1d21; }
  #summary { font-size: 1.25rem; font-weight: 700; }
  .pass { color: #2b8a3e; }
  .fail { color: #c92a2a; font-weight: 700; }
</style>
</head>
<body>
<h1>ロジックのテスト</h1>
<p id="summary">実行中…</p>
<ul id="results"></ul>

<script src="js/sq-data.js"></script>
<script src="js/sq-calc.js"></script>
<script>
(function () {
  'use strict';
  const SQ = window.SQ;
  const D = SQ.DATA;
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, msg: e && e.message ? e.message : String(e) }); }
  }
  function eq(a, b, label) {
    const x = JSON.stringify(a), y = JSON.stringify(b);
    if (x !== y) throw new Error((label ? label + ': ' : '') + '期待値 ' + y + ' / 実際 ' + x);
  }
  function near(a, b, label, tol) {
    if (!(Math.abs(a - b) <= (tol || 1e-6))) throw new Error((label ? label + ': ' : '') + '期待値 ' + b + ' / 実際 ' + a);
  }
  function ok(c, label) { if (!c) throw new Error(label || '条件を満たしていません'); }
  const isStep = x => Math.abs(x / D.step - Math.round(x / D.step)) < 1e-9;

  // ---- MAX の推定 ----
  test('推定MAX：60kg×5回 → 70kg', () => eq(SQ.estimate1RM(60, 5), 70));
  test('推定MAX：10回を超える回数は10回として計算', () => eq(SQ.estimate1RM(60, 15), SQ.estimate1RM(60, 10)));
  test('推定MAX：1回ならその重さ、不正な入力は null', () => {
    eq(SQ.estimate1RM(100, 1), 100);
    eq(SQ.estimate1RM(0, 5), null);
    eq(SQ.estimate1RM(60, 0), null);
  });

  // ---- 伸びの速さ ----
  test('体重比1.0・1.5・2.0倍は表の値そのまま', () => {
    eq(SQ.ratesFor(1.0), { low: 2.0, high: 3.5 });
    eq(SQ.ratesFor(1.5), { low: 1.0, high: 2.0 });
    eq(SQ.ratesFor(2.0), { low: 0.5, high: 1.5 });
  });
  test('あいだは直線でつなぐ（1.25倍 → 1.5〜2.75%）', () => {
    const r = SQ.ratesFor(1.25);
    near(r.low, 1.5, 'low'); near(r.high, 2.75, 'high');
  });
  test('1.0倍未満と2.0倍より上は端の値', () => {
    eq(SQ.ratesFor(0.6), SQ.ratesFor(1.0));
    eq(SQ.ratesFor(2.8), SQ.ratesFor(2.0));
  });
  test('強いほど遅く伸びる（体重比が上がると幅は下がる）', () => {
    for (let r = 0.8; r < 2.2; r += 0.05) {
      const a = SQ.ratesFor(r), b = SQ.ratesFor(r + 0.05);
      ok(b.low <= a.low + 1e-9 && b.high <= a.high + 1e-9, r.toFixed(2));
      ok(a.low < a.high, '下限 < 上限 ' + r.toFixed(2));
    }
  });
  test('8週までは同じペース、9週目からは半分', () => {
    near(SQ.gainPct(8, 2), 16);
    near(SQ.gainPct(12, 2), 20);
    near(SQ.gainPct(16, 2), 24);
  });
  test('ページの表（8週間の伸び）と計算が一致', () => {
    const t = [[1.0, 16, 28], [1.5, 8, 16], [2.0, 4, 12]];
    t.forEach(([ratio, lo, hi]) => {
      const r = SQ.ratesFor(ratio);
      near(SQ.gainPct(8, r.low), lo, ratio + ' 下限');
      near(SQ.gainPct(8, r.high), hi, ratio + ' 上限');
    });
  });

  // ---- 研究のデータ ----
  test('研究の点は14グループ、そのうち11グループが幅に入る', () => {
    eq(SQ.bandCoverage(), { inside: 11, total: 14 });
  });
  test('幅から外れた研究は、どれも速いペースより速い', () => {
    D.studies.forEach(s => ok(SQ.studyPosition(s) !== 'below', s.id + ' が控えめなペースより遅い'));
    eq(D.studies.filter(s => SQ.studyPosition(s) === 'above').map(s => s.id), ['cholewa', 'travis-exp', 'aube-18']);
  });
  test('論文の数字から計算した伸び（例：Helms 2018 の%群 +10.0%）', () => {
    const s = D.studies.find(x => x.id === 'helms-pct');
    near(SQ.studyRate(s).pct, 9.99, 'pct', 0.01);
  });
  test('研究はすべて出典つき', () => {
    D.studies.forEach(s => ok(D.refs[s.ref] && D.refs[s.ref].doi, s.id));
  });
  test('近い研究は、同じ論文が重ならず近い順', () => {
    const list = SQ.nearestStudies(1.3, 3);
    eq(list.length, 3);
    eq(list[0].ref, 'schoenfeld2019');
    eq(new Set(list.map(s => s.ref)).size, 3);
    ok(Math.abs(list[0].ratio - 1.3) <= Math.abs(list[1].ratio - 1.3) && Math.abs(list[1].ratio - 1.3) <= Math.abs(list[2].ratio - 1.3), '近い順');
  });

  // ---- 予測と判定 ----
  test('予測：80kg・体重80kg・8週 → 92.8〜102.4kg', () => {
    const p = SQ.predict(80, 80, 8);
    near(p.lowMax, 92.8); near(p.highMax, 102.4);
    eq(p.curve.length, 9);
    near(p.curve[0].low, 80); near(p.curve[8].high, 102.4);
  });
  test('判定：控えめでも届く / 範囲内 / 範囲外', () => {
    const p = SQ.predict(80, 80, 8);
    eq(SQ.verdict(p, 10), 'likely');
    eq(SQ.verdict(p, 20), 'possible');
    eq(SQ.verdict(p, 30), 'beyond');
    eq(SQ.verdict(p, 0), null);
  });
  test('必要な週数：100kg・体重100kg・+20kg → 速いペース6週、控えめ12週', () => {
    eq(SQ.weeksNeeded(100, 100, 20), { fastest: 6, slowest: 12 });
  });
  test('1年で届かない目標は null', () => {
    eq(SQ.weeksNeeded(200, 90, 150).slowest, null);
  });

  // ---- 入力 ----
  test('範囲外の週数・目標は既定値に直す', () => {
    const n = SQ.normalizeInput({ max: 100, bw: 70, weeks: 30, target: -3 });
    eq([n.weeks, n.target], [8, null]);
  });
  test('体重とMAXが空・範囲外ならエラー', () => {
    eq(SQ.validate(SQ.normalizeInput({ max: '', bw: '' })).length, 2);
    eq(SQ.validate(SQ.normalizeInput({ max: 100, bw: 70 })).length, 0);
    eq(SQ.validate(SQ.normalizeInput({ max: 500, bw: 70 })).length, 1);
  });

  const ul = document.getElementById('results');
  results.forEach(r => {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.msg ? '：' + r.msg : '');
    ul.appendChild(li);
  });
  const failed = results.filter(r => !r.ok).length;
  const s = document.getElementById('summary');
  s.textContent = failed ? 'FAIL：' + results.length + '件中 ' + failed + '件失敗' : 'ALL PASS：' + results.length + '件';
  s.className = failed ? 'fail' : 'pass';
})();
</script>
</body>
</html>
